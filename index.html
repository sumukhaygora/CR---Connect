<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CR CONNECT | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS Safari zooming & rendering fixes */
        input, select, textarea { 
            font-size: 16px !important; 
            -webkit-appearance: none; /* Removes iOS inner shadows and default styles */
            appearance: none;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh; /* Fixes iOS bottom bar height issues */
        }
        
        /* Custom Medical Doodle Animations */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
        }
        @keyframes float-medium {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-4deg); }
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.05); opacity: 0.4; }
        }
        .animate-float-slow { animation: float-slow 7s ease-in-out infinite; }
        .animate-float-medium { animation: float-medium 5s ease-in-out infinite; }
        .animate-pulse-soft { animation: pulse-soft 3s ease-in-out infinite; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Seamless Doodle Pattern Background */
        .pattern-overlay {
            position: absolute;
            inset: 0;
            background-image: url('images (1)_2.jpg');
            background-repeat: repeat;
            background-size: 250px;
            opacity: 0.06; /* Subdued so text remains highly readable */
            z-index: 0;
            pointer-events: none;
        }
        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* Professional Logo Shine Animation */
        .text-shine {
            background: linear-gradient(to right, #1e3a8a 20%, #60a5fa 40%, #60a5fa 60%, #1e3a8a 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Vibrant Sparkling SAN GROUP Animation */
        .san-vibrant {
            background: linear-gradient(to right, #ff007a, #9c27b0, #ff007a);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite, pulse-glow 2s ease-in-out infinite alternate;
        }
        @keyframes pulse-glow {
            from { filter: hue-rotate(0deg) drop-shadow(0 0 2px rgba(255,0,122,0.4)); }
            to { filter: hue-rotate(45deg) drop-shadow(0 0 8px rgba(156,39,176,0.6)); }
        }

    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex">

    <!-- LEFT SIDE: Medical Branding & Animated SVGs (Hidden on Mobile) -->
    <div class="hidden lg:flex lg:w-5/12 bg-gradient-to-br from-slate-900 via-blue-900 to-blue-800 relative overflow-hidden items-center justify-center">
        <!-- DNA Doodle -->
        <svg class="absolute top-16 left-12 w-32 h-32 text-blue-300 opacity-20 animate-float-slow" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.25 4.5l-4.5 15M4.5 14.25l15-4.5m-15 4.5c0 1.243.684 2.378 1.79 3.013a3.75 3.75 0 004.42 0c1.106-.635 1.79-1.77 1.79-3.013M19.5 9.75c0-1.243-.684-2.378-1.79-3.013a3.75 3.75 0 00-4.42 0c-1.106.635-1.79 1.77-1.79 3.013" /></svg>
        <!-- Heartbeat Doodle -->
        <svg class="absolute bottom-24 right-16 w-40 h-40 text-blue-400 opacity-20 animate-pulse-soft" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12h-3.414a1 1 0 00-.707.293l-1.879 1.879a1 1 0 01-1.414 0l-3.172-3.172a1 1 0 00-1.414 0l-3.172 3.172a1 1 0 01-1.414 0L2.707 12.293A1 1 0 002 12H1" /><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h-3m3 0l2.5-4.5L12 18l3.5-9 2 3h3" /></svg>
        <!-- Stethoscope Doodle -->
        <svg class="absolute top-1/3 right-10 w-28 h-28 text-blue-200 opacity-20 animate-float-medium" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8.686 2 6 4.686 6 8v3c0 2.973 2.162 5.44 5 5.917V19.5a2.5 2.5 0 005 0V14c0-1.105-.895-2-2-2h-1m-6 0H6m6 0h.01M15.5 12h2a2.5 2.5 0 000-5h-2" /><circle cx="12" cy="20" r="2" /></svg>
        <!-- Medical Cross Doodle -->
        <svg class="absolute bottom-16 left-16 w-24 h-24 text-blue-300 opacity-10 animate-float-slow" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM11 7a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>

        <div class="glass-panel p-10 rounded-2xl z-10 mx-12 text-center shadow-2xl">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/20 text-blue-300 mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2 tracking-tight">CR CONNECT</h2>
            <h3 class="text-xl text-blue-200 font-medium mb-4">Official Query Portal</h3>
            <p class="text-blue-100/70 text-sm leading-relaxed">
                A streamlined communication channel connecting the batch with the Class Representatives. Submit queries securely.
            </p>
        </div>
    </div>

    <!-- RIGHT SIDE: The Form with Doodle Background -->
    <div class="w-full lg:w-7/12 flex items-center justify-center p-6 sm:p-12 bg-white relative overflow-hidden">
        
        <!-- Seamless Medical Doodle Background -->
        <div class="pattern-overlay"></div>
        
        <div class="content-layer w-full max-w-lg bg-white/95 backdrop-blur-md p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-100">
            
            <!-- Mobile Header (Only shows on small screens) -->
            <div class="lg:hidden text-center mb-2">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h1 class="text-3xl font-extrabold text-shine tracking-tight uppercase">CR CONNECT</h1>
            </div>

            <!-- Desktop Title with Professional Animation -->
            <h1 class="text-4xl font-extrabold text-shine text-center mb-2 hidden lg:block tracking-tight uppercase">CR CONNECT</h1>
            
            <!-- Unified Tagline (Stacked and Centered) -->
            <div class="text-center mb-8 pb-6 border-b border-slate-100 uppercase flex flex-col items-center justify-center gap-1.5">
                <span class="text-[10px] sm:text-xs font-bold text-slate-400 tracking-widest">DEVELOPED AND MAINTAINED BY</span>
                <span class="san-vibrant font-extrabold text-[14px] sm:text-[16px] tracking-widest">SAN GROUP</span>
            </div>

            <form id="queryForm" class="space-y-6">
                <div>
                    <label for="studentName" class="block text-sm font-semibold text-slate-700 mb-1.5">Full Name</label>
                    <input type="text" id="studentName" required placeholder="Enter your name" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all">
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label for="rollNumber" class="block text-sm font-semibold text-slate-700 mb-1.5">Roll No.</label>
                        <input type="text" id="rollNumber" required placeholder="e.g. 166" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all">
                    </div>
                    <div class="w-1/2">
                        <label for="whatsappNumber" class="block text-sm font-semibold text-slate-700 mb-1.5">WhatsApp No.</label>
                        <input type="tel" id="whatsappNumber" required placeholder="10-digit number" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label for="category" class="block text-sm font-semibold text-slate-700 mb-1.5">Query Category</label>
                    <select id="category" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all appearance-none">
                        <option value="" disabled selected>Select category...</option>
                        <option value="Academics">Academics & Syllabus</option>
                        <option value="Schedule">Schedule & Timetable</option>
                        <option value="Events">Events & Sports</option>
                        <option value="Other">Other Admin Queries</option>
                    </select>
                </div>

                <div>
                    <label for="message" class="block text-sm font-semibold text-slate-700 mb-1.5">Detailed Message</label>
                    <textarea id="message" rows="4" required placeholder="Type your query clearly..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all resize-y"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md shadow-blue-500/20 active:scale-[0.98]">
                    Securely Submit Query
                </button>
            </form>
            
            <div id="statusMessage" class="hidden text-center p-3.5 rounded-xl mt-5 font-medium text-sm"></div>

            <!-- Security Warning -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <div class="inline-flex items-center justify-center space-x-1.5 text-slate-400">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                    <span class="text-[10px] font-bold tracking-wider">SECURE CONNECTION</span>
                </div>
                <p class="text-[10px] text-slate-400 font-medium leading-relaxed mt-1">
                    DEVICE METADATA & TIMESTAMPS MONITORED FOR ANTI-SPAM
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDnh_dF3TMZoaHDeMvdt0_ozWRdb6Tcvmg",
            authDomain: "cr-connect-414e5.firebaseapp.com",
            projectId: "cr-connect-414e5",
            storageBucket: "cr-connect-414e5.firebasestorage.app",
            messagingSenderId: "517625003925",
            appId: "1:517625003925:web:7a4ff2cbb418be28bbc09c",
            measurementId: "G-BVSN2QKYGN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const COOLDOWN_MINUTES = 10;
        let spamTimer;

        window.onload = () => {
            const lastSubmit = localStorage.getItem('lastSubmissionTime');
            if (lastSubmit) {
                const endTime = parseInt(lastSubmit) + (COOLDOWN_MINUTES * 60 * 1000);
                if (Date.now() < endTime) lockForm(endTime);
            }
        };

        function lockForm(endTime) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed', 'shadow-none');
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md', 'shadow-blue-500/20');

            spamTimer = setInterval(() => {
                const now = Date.now();
                const timeLeft = Math.ceil((endTime - now) / 1000 / 60);
                
                if (timeLeft <= 0) {
                    clearInterval(spamTimer);
                    btn.disabled = false;
                    btn.textContent = 'Securely Submit Query';
                    btn.classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed', 'shadow-none');
                    btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md', 'shadow-blue-500/20');
                } else {
                    btn.textContent = `Anti-Spam Cooldown (${timeLeft}m left)`;
                }
            }, 1000);
            btn.textContent = `Anti-Spam Cooldown (${Math.ceil((endTime - Date.now()) / 1000 / 60)}m left)`;
        }

        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const lastSubmit = localStorage.getItem('lastSubmissionTime');
            if (lastSubmit && Date.now() < parseInt(lastSubmit) + (COOLDOWN_MINUTES * 60 * 1000)) {
                alert(`Please wait ${COOLDOWN_MINUTES} minutes between submissions.`);
                return;
            }

            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.textContent = 'Encrypting & Sending...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                await db.collection('cr_queries').add({
                    name: document.getElementById('studentName').value,
                    rollNumber: document.getElementById('rollNumber').value,
                    whatsapp: document.getElementById('whatsappNumber').value,
                    category: document.getElementById('category').value,
                    message: document.getElementById('message').value,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'unread',
                    resolvedBy: '' // New field for CR tracking
                });

                const now = Date.now();
                localStorage.setItem('lastSubmissionTime', now.toString());
                
                document.getElementById('queryForm').reset();
                status.textContent = 'Query transmitted securely! The CR team will review it shortly.';
                status.className = 'block text-center p-3.5 rounded-xl mt-5 font-medium text-sm bg-green-50 text-green-700 border border-green-200';
                
                lockForm(now + (COOLDOWN_MINUTES * 60 * 1000));
            } catch (error) {
                console.error("Error: ", error);
                status.innerHTML = '<strong>Error sending message!</strong> Check your connection.';
                status.className = 'block text-center p-3.5 rounded-xl mt-5 font-medium text-sm bg-red-50 text-red-700 border border-red-200';
                btn.disabled = false;
                btn.textContent = 'Securely Submit Query';
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
            
            setTimeout(() => { status.classList.add('hidden'); }, 7000);
        });
    </script>
</body>
</html>
